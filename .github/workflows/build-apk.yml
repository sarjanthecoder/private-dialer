name: Build Android APK

on:
  push:
    branches: [main, normal-dialer]
  pull_request:
    branches: [main]
  workflow_dispatch:   # Manual trigger button in GitHub UI

jobs:
  build:
    name: Build APK (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 4. Install JS dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --prefer-offline

      # ── 5. Expo Prebuild (generates android/ folder from native/ sources) ────
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_DOTENV: 1

      # ── 6. Cache Gradle ──────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 7. Make gradlew executable ───────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── 8. Build debug APK (no signing needed) ───────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      # ── 9. Rename APK with branch + date ────────────────────────────────────
      - name: Rename APK
        run: |
          BRANCH="${{ github.ref_name }}"
          DATE=$(date +%Y%m%d-%H%M)
          APK_NAME="RootAccessDialer-${BRANCH}-${DATE}.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      # ── 10. Upload APK as artifact (download from Actions tab) ───────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      # ── 11. Summary ──────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "### ✅ APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** \`${{ env.APK_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Go to Actions tab → this run → Artifacts section at the bottom" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          APK_SIZE=$(du -sh "${{ env.APK_NAME }}" | cut -f1)
          echo "**Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
