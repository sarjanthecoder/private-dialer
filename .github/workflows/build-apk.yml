name: Build Android APK

on:
  push:
    branches: [main, normal-dialer]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_DOTENV: 1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── 8. Build standalone release APK (JS bundled offline, no Metro needed) ──
      - name: Build Standalone Release APK
        id: gradle_build
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee ../gradle-build.log
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Capture error to summary if failed
        if: failure()
        run: |
          echo "## ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -B 3 -A 15 -E "(e: |FAILURE:|What went wrong|Execution failed|Compile.*failed)" gradle-build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY || tail -n 60 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Rename APK
        if: success()
        run: |
          BRANCH="${{ github.ref_name }}"
          DATE=$(date +%Y%m%d-%H%M)
          APK_NAME="RootAccessDialer-${BRANCH}-RELEASE-${DATE}.apk"
          FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "Error: No APK found in android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at: $FOUND_APK"
          mv "$FOUND_APK" "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "### ✅ Release APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** \`${{ env.APK_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** Standalone Offline Release APK (no dev server needed)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Go to Actions tab → this run → Artifacts section at the bottom" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          APK_SIZE=$(du -sh "${{ env.APK_NAME }}" | cut -f1)
          echo "**Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
